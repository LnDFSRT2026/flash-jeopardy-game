<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLASH Jeopardy Host</title><style>
:root{--navy:#0b1f3a;--blue:#0057b8;--teal:#00a3ad;--gold:#ffc72c;--white:#fff;--red:#df4747;--green:#2fa84f}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--navy);color:#fff;min-height:100vh}header{padding:16px 24px;background:#081830;border-bottom:4px solid var(--teal);display:flex;justify-content:space-between;align-items:center}h1{margin:0;letter-spacing:2px}h1 span,h2,.gold{color:var(--gold)}main{padding:22px;max-width:1200px;margin:auto}.card{background:#081830;border:2px solid var(--teal);border-radius:10px;padding:20px;margin-bottom:18px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:6px;padding:11px 16px;font-weight:700;background:var(--blue);color:#fff;cursor:pointer}.green{background:var(--green)}.red{background:var(--red)}.teal{background:var(--teal)}input,select,textarea{width:100%;padding:12px;border-radius:6px;border:1px solid #89a2bf;font-size:16px}label{display:block;margin:12px 0 5px;font-weight:700}.hidden{display:none!important}.status{padding:10px;border-radius:6px;background:#123a73;margin-top:12px}.score{font-size:32px;color:var(--gold);font-weight:900}.small{font-size:13px;opacity:.8}.clue{font-size:clamp(24px,4vw,40px);line-height:1.35;text-align:center;padding:25px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.cat{background:var(--blue);padding:12px 5px;text-align:center;font-weight:800;min-height:62px;display:flex;align-items:center;justify-content:center}.tile{background:#123a73;color:var(--gold);font-size:26px;font-weight:900;padding:20px 2px;text-align:center;cursor:pointer}.tile.done{opacity:.25;pointer-events:none}@media(max-width:700px){.grid{grid-template-columns:repeat(5,minmax(105px,1fr));overflow:auto}main{padding:12px}.card{padding:14px}}
</style></head><body><header><h1>FLASH <span>JEOPARDY</span></h1><div>HOST • Confidential, Cotality L&amp;D</div></header><main>
<div id="configWarning" class="card"><h2>Firebase setup required</h2><p>Paste the same Firebase configuration into host.html and play.html. Then upload both files to GitHub.</p></div>
<section class="card"><h2>Live Session</h2><div class="row"><div style="flex:1"><label>Game code</label><input id="code" value="OPENLY26"></div><button class="btn green" id="start">Start or Reset Session</button><button class="btn red" id="end">End Session</button></div><div id="sessionStatus" class="status">Session not started.</div><p>Participant link: <a style="color:#fff" href="play.html" target="_blank">play.html</a></p></section>
<section class="card"><h2>Teams and Scores</h2><div id="teams" class="row"></div></section>
<section class="card"><h2>Game Board</h2><div id="board" class="grid"></div></section>
<section class="card hidden" id="active"><div class="small" id="clueLabel"></div><div class="clue" id="clueText"></div><div class="row"><button class="btn teal" id="closeAnswers">Close Answers</button><button class="btn" id="reveal">Reveal Correct Response</button><button class="btn red" id="finish">Close Clue</button></div><div id="correct" class="status hidden"></div><h3>Team responses</h3><div id="responses"></div></section>
</main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script>
const firebaseConfig = {
  apiKey: "AIzaSyCwchjG95prUrQUlgQ4mWNQmFQ3G1xBjis",
  authDomain: "flash-jeopardy-live.firebaseapp.com",
  databaseURL: "https://flash-jeopardy-live-default-rtdb.firebaseio.com/",
  projectId: "flash-jeopardy-live",
  storageBucket: "flash-jeopardy-live.firebasestorage.app",
  messagingSenderId: "83367409392",
  appId: "1:833674093929:web:9a7487c2c1feec4f2dc9f8"
};
const GAME={"values": [100, 200, 300, 400, 500], "categories": [{"name": "Embedded Basics", "clues": [{"q": "This word means built in.", "a": "What is embedded?"}, {"q": "This option launches the estimate into Validate.", "a": "What is Open in Cotality Validate?"}, {"q": "Validate checks the estimate against these standards.", "a": "What are company rules and guidelines?"}, {"q": "The training estimate contains these so exceptions fire.", "a": "What are planned errors?"}, {"q": "Claims dated before this October date cannot use Open in Validate.", "a": "What is October 9?"}]}, {"name": "Navigate Validate", "clues": [{"q": "This is the default estimate review view.", "a": "What is Review?"}, {"q": "This filter shows items requiring an edit or explanation.", "a": "What is Exceptions Only?"}, {"q": "This filter identifies work still needing attention.", "a": "What is Unexplained Items?"}, {"q": "Validate displays these two exception types.", "a": "What are Estimate Rule Items and Line-Item exceptions?"}, {"q": "This tab provides enriched data or weather verification.", "a": "What is Integrations?"}]}, {"name": "Edit the Estimate", "clues": [{"q": "Select this before changing line items.", "a": "What is Edit Estimate?"}, {"q": "Every new line item needs this assignment.", "a": "What is Coverage?"}, {"q": "This Kitchen item changes in quantity from 1 to 2.", "a": "What is Light Fixture, Ceiling, Very Good?"}, {"q": "This Family Room item changes its minimum charge from HVAC to Flooring.", "a": "What is the Drop-in Floor Register?"}, {"q": "These two choices either rerun rules or save without rerunning them.", "a": "What are Submit & Validate and Exit Estimate Mode?"}]}, {"name": "Explain and Complete", "clues": [{"q": "Select the checkbox and use this command for an exception.", "a": "What is Explain?"}, {"q": "Explained exceptions have this visibility afterward.", "a": "What is they remain visible?"}, {"q": "This code means Approved For This Claim and requires a note.", "a": "What is Approved?"}, {"q": "This code means an invalid rule and requires a note.", "a": "What is Invalid?"}, {"q": "This status-note option sends the note to the timeline.", "a": "What is Send Note to Corelogic?"}]}, {"name": "Approve or Return", "clues": [{"q": "Choose this thumb when no contractor changes are needed.", "a": "What is the green thumb?"}, {"q": "The contractor approval path gives Validate this status.", "a": "What is Approved?"}, {"q": "Choose this thumb when changes are needed.", "a": "What is the red thumb?"}, {"q": "The contractor return path gives Validate this status.", "a": "What is Returned with Exceptions?"}, {"q": "The return path gives the estimate this status.", "a": "What is Rejected Approval?"}]}]}; const $=id=>document.getElementById(id); let db,auth,roomRef,current=null; const configured=!firebaseConfig.apiKey.startsWith('PASTE_'); if(configured){firebase.initializeApp(firebaseConfig);db=firebase.database();auth=firebase.auth();auth.signInAnonymously();$('configWarning').classList.add('hidden')}
const teamData={team1:{name:'Team 1',score:0},team2:{name:'Team 2',score:0},team3:{name:'Team 3',score:0}};
function room(){return $('code').value.trim().toUpperCase()||'OPENLY26'}
$('start').onclick=async()=>{if(!configured)return alert('Paste your Firebase configuration first.'); await auth.signInAnonymously();roomRef=db.ref('games/'+room());await roomRef.set({status:'open',teams:teamData,currentClue:null,players:{},responses:{}});listen();$('sessionStatus').textContent='Session '+room()+' is open.'}
$('end').onclick=()=>roomRef&&roomRef.update({status:'ended',currentClue:null});
function listen(){roomRef.off();roomRef.on('value',s=>renderLive(s.val()||{}))}
function renderLive(x){const wrap=$('teams');wrap.innerHTML='';Object.entries(x.teams||teamData).forEach(([id,t])=>{const d=document.createElement('div');d.className='card';d.style.margin=0;d.innerHTML=`<b>${t.name}</b><div class="score">${t.score||0}</div><button class="btn green">+ Points</button> <button class="btn red">- Points</button>`;const bs=d.querySelectorAll('button');bs[0].onclick=()=>changeScore(id,current?.value||100);bs[1].onclick=()=>changeScore(id,-(current?.value||100));wrap.appendChild(d)});const res=x.responses?.[current?.id]||{};$('responses').innerHTML=Object.values(res).map(r=>`<div class="status"><b>${r.teamName} • ${r.playerName}</b><br>${escapeHtml(r.answer)}</div>`).join('')||'<p>No responses yet.</p>'}
function changeScore(id,delta){roomRef.child('teams/'+id+'/score').transaction(v=>(v||0)+delta)}
function build(){const b=$('board');GAME.categories.forEach(c=>{let d=document.createElement('div');d.className='cat';d.textContent=c.name;b.appendChild(d)});GAME.values.forEach((v,ri)=>GAME.categories.forEach((c,ci)=>{let d=document.createElement('div');d.className='tile';d.textContent=v;d.onclick=()=>openClue(ci,ri,d);b.appendChild(d)}))}
async function openClue(ci,ri,tile){if(!roomRef)return alert('Start the session first.');const c=GAME.categories[ci],clue=c.clues[ri];current={id:`c${ci}q${ri}`,category:c.name,value:GAME.values[ri],question:clue.q,answer:clue.a,acceptingAnswers:true,answerVisible:false};await roomRef.child('responses/'+current.id).remove();await roomRef.child('currentClue').set(current);tile.classList.add('done');$('active').classList.remove('hidden');$('clueLabel').textContent=`${c.name} for ${current.value}`;$('clueText').textContent=clue.q;$('correct').textContent=clue.a;$('correct').classList.add('hidden')}
$('closeAnswers').onclick=()=>roomRef&&roomRef.child('currentClue/acceptingAnswers').set(false);$('reveal').onclick=()=>{roomRef&&roomRef.child('currentClue/answerVisible').set(true);$('correct').classList.remove('hidden')};$('finish').onclick=()=>{roomRef&&roomRef.child('currentClue').remove();$('active').classList.add('hidden');current=null};
function escapeHtml(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}build();
</script></body></html>
