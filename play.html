<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLASH Jeopardy Participant</title><style>
:root{--navy:#0b1f3a;--blue:#0057b8;--teal:#00a3ad;--gold:#ffc72c;--white:#fff;--red:#df4747;--green:#2fa84f}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--navy);color:#fff;min-height:100vh}header{padding:16px 24px;background:#081830;border-bottom:4px solid var(--teal);display:flex;justify-content:space-between;align-items:center}h1{margin:0;letter-spacing:2px}h1 span,h2,.gold{color:var(--gold)}main{padding:22px;max-width:1200px;margin:auto}.card{background:#081830;border:2px solid var(--teal);border-radius:10px;padding:20px;margin-bottom:18px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:6px;padding:11px 16px;font-weight:700;background:var(--blue);color:#fff;cursor:pointer}.green{background:var(--green)}.red{background:var(--red)}.teal{background:var(--teal)}input,select,textarea{width:100%;padding:12px;border-radius:6px;border:1px solid #89a2bf;font-size:16px}label{display:block;margin:12px 0 5px;font-weight:700}.hidden{display:none!important}.status{padding:10px;border-radius:6px;background:#123a73;margin-top:12px}.score{font-size:32px;color:var(--gold);font-weight:900}.small{font-size:13px;opacity:.8}.clue{font-size:clamp(24px,4vw,40px);line-height:1.35;text-align:center;padding:25px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.cat{background:var(--blue);padding:12px 5px;text-align:center;font-weight:800;min-height:62px;display:flex;align-items:center;justify-content:center}.tile{background:#123a73;color:var(--gold);font-size:26px;font-weight:900;padding:20px 2px;text-align:center;cursor:pointer}.tile.done{opacity:.25;pointer-events:none}@media(max-width:700px){.grid{grid-template-columns:repeat(5,minmax(105px,1fr));overflow:auto}main{padding:12px}.card{padding:14px}}
main{max-width:700px}.teamScore{text-align:center;font-size:52px;color:var(--gold);font-weight:900}textarea{min-height:120px}</style></head><body><header><h1>FLASH <span>JEOPARDY</span></h1><div>PARTICIPANT • Confidential, Cotality L&amp;D</div></header><main>
<div id="configWarning" class="card"><h2>Setup incomplete</h2><p>The host must add the Firebase configuration to this file.</p></div>
<section id="join" class="card"><h2>Join the Game</h2><label>Game code</label><input id="code" value="OPENLY26" maxlength="20"><label>Your name</label><input id="name" maxlength="40" placeholder="Enter your name"><label>Choose your team</label><select id="team"><option value="team1">Team 1</option><option value="team2">Team 2</option><option value="team3">Team 3</option></select><button class="btn green" id="joinBtn" style="margin-top:16px;width:100%">Join Game</button><div id="joinStatus" class="status hidden"></div></section>
<section id="game" class="hidden"><div class="card"><div id="teamName" style="text-align:center;font-size:24px;font-weight:800"></div><div class="teamScore" id="score">0</div><div style="text-align:center">TEAM POINTS</div></div><div class="card" id="waiting"><h2>Waiting for the host</h2><p>The next clue will appear here.</p></div><div class="card hidden" id="clueBox"><div class="small" id="label"></div><div class="clue" id="question"></div><label>Your team's response</label><textarea id="answer" placeholder="Type your response"></textarea><button class="btn green" id="submit" style="width:100%;margin-top:12px">Submit Answer</button><div id="answerStatus" class="status hidden"></div><div id="revealed" class="status hidden"></div></div></section>
</main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script>
const firebaseConfig = {
  apiKey: "AIzaSyCwchjG95prUrQUlgQ4mWNQmFQ3G1xBjis",
  authDomain: "flash-jeopardy-live.firebaseapp.com",
  databaseURL: "https://flash-jeopardy-live-default-rtdb.firebaseio.com/",
  projectId: "flash-jeopardy-live",
  storageBucket: "flash-jeopardy-live.firebasestorage.app",
  messagingSenderId: "833674093929",
  appId: "1:833674093929:web:9a7487c2c1feec4f2dc9f8"
};
const $=id=>document.getElementById(id);let db,auth,uid,roomRef,player,currentId;const configured=!firebaseConfig.apiKey.startsWith('PASTE_');if(configured){firebase.initializeApp(firebaseConfig);db=firebase.database();auth=firebase.auth();$('configWarning').classList.add('hidden')}
$('joinBtn').onclick=async()=>{if(!configured)return alert('The host has not finished Firebase setup.');const name=$('name').value.trim(),code=$('code').value.trim().toUpperCase(),teamId=$('team').value;if(!name)return alert('Enter your name.');$('joinBtn').disabled=true;try{const cred=await auth.signInAnonymously();uid=cred.user.uid;roomRef=db.ref('games/'+code);const snap=await roomRef.once('value');if(!snap.exists()||snap.val().status!=='open')throw Error('The game session is not open.');const team=snap.val().teams[teamId];player={playerName:name,teamId,teamName:team.name,joinedAt:firebase.database.ServerValue.TIMESTAMP};await roomRef.child('players/'+uid).set(player);roomRef.child('players/'+uid).onDisconnect().remove();$('join').classList.add('hidden');$('game').classList.remove('hidden');$('teamName').textContent=team.name;listen()}catch(e){$('joinStatus').textContent=e.message;$('joinStatus').classList.remove('hidden');$('joinBtn').disabled=false}}
function listen(){roomRef.child('teams/'+player.teamId+'/score').on('value',s=>$('score').textContent=s.val()||0);roomRef.child('status').on('value',s=>{if(s.val()==='ended')showWaiting('The game has ended.')});roomRef.child('currentClue').on('value',s=>{const c=s.val();if(!c){currentId=null;showWaiting('Waiting for the host');return};currentId=c.id;$('waiting').classList.add('hidden');$('clueBox').classList.remove('hidden');$('label').textContent=`${c.category} • ${c.value} points`;$('question').textContent=c.question;$('answer').disabled=!c.acceptingAnswers;$('submit').disabled=!c.acceptingAnswers;$('answerStatus').textContent=c.acceptingAnswers?'Discuss with your team, then submit your response.':'Answers are closed.';$('answerStatus').classList.remove('hidden');if(c.answerVisible){$('revealed').textContent='The host has revealed the correct response on the main screen.';$('revealed').classList.remove('hidden')}else $('revealed').classList.add('hidden')})}
$('submit').onclick=async()=>{const answer=$('answer').value.trim();if(!answer)return alert('Enter an answer.');if(!currentId)return;await roomRef.child('responses/'+currentId+'/'+uid).set({...player,answer,submittedAt:firebase.database.ServerValue.TIMESTAMP});$('answer').disabled=true;$('submit').disabled=true;$('answerStatus').textContent='Answer submitted. Waiting for the host.'}
function showWaiting(text){$('waiting').classList.remove('hidden');$('clueBox').classList.add('hidden');$('waiting').querySelector('h2').textContent=text;$('answer').value='';$('answer').disabled=false;$('submit').disabled=false}
</script></body></html>
