<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLASH Jeopardy Participant</title><style>
:root{--navy:#0b1f3a;--blue:#0057b8;--teal:#00a3ad;--gold:#ffc72c;--red:#df4747;--green:#2fa84f;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--navy);color:#fff;min-height:100vh}header{padding:16px 24px;background:#081830;border-bottom:4px solid var(--teal);display:flex;justify-content:space-between;gap:18px;align-items:center}h1{margin:0;letter-spacing:2px}h1 span,h2,.gold{color:var(--gold)}main{padding:20px;max-width:1100px;margin:auto}.card{background:#081830;border:2px solid var(--teal);border-radius:10px;padding:20px;margin-bottom:16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:7px;padding:11px 16px;font-weight:700;background:var(--blue);color:#fff;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.green{background:var(--green)}.red{background:var(--red)}.teal{background:var(--teal)}input,select{width:100%;padding:12px;border-radius:7px;border:1px solid #89a2bf;font-size:16px}.hidden{display:none!important}.status{padding:11px;border-radius:7px;background:#123a73;margin-top:12px}.score{font-size:34px;color:var(--gold);font-weight:900}.timer{font-size:64px;line-height:1;color:var(--gold);font-weight:900;text-align:center}.clue{font-size:clamp(22px,4vw,38px);line-height:1.3;text-align:center;padding:22px}.choice{display:block;width:100%;padding:14px;margin:9px 0;border:2px solid #3c6ea8;border-radius:8px;background:#123a73;color:#fff;text-align:left;font-size:18px;font-weight:700;cursor:pointer}.choice.selected{border-color:var(--gold);background:#1a4a8f}.choice.correct{border-color:var(--green);background:#174e2b}.choice.wrong{border-color:var(--red);background:#5b2020}.team-box{flex:1;min-width:190px}.progress{height:10px;background:#183657;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:var(--gold)}.question-list button{min-width:145px}.small{font-size:13px;opacity:.82}.response{border-left:5px solid var(--teal)}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}.timer{font-size:52px}main{padding:12px}.card{padding:15px}}
main{max-width:700px}.teamScore{text-align:center;font-size:52px;color:var(--gold);font-weight:900}</style></head><body><header><h1>FLASH <span>JEOPARDY</span></h1><div>PARTICIPANT • Confidential, Cotality L&amp;D</div></header><main>
<div id="configWarning" class="card"><h2>One setup item remains</h2><p>The host needs to add the exact Firebase Realtime Database URL to this file.</p></div>
<section id="join" class="card"><h2>Join the Game</h2><label>Game code</label><input id="code" value="OPENLY26"><label>Your name</label><input id="name" maxlength="40" placeholder="Enter your name"><label>Choose your team</label><select id="team"><option value="team1">Team 1</option><option value="team2">Team 2</option><option value="team3">Team 3</option></select><button class="btn green" id="joinBtn" style="margin-top:16px;width:100%">Join Game</button><div id="joinStatus" class="status hidden"></div></section>
<section id="game" class="hidden"><div class="card"><div id="teamName" style="text-align:center;font-size:24px;font-weight:800"></div><div class="teamScore" id="score">0</div><div style="text-align:center">TEAM POINTS</div></div><div class="card" id="waiting"><h2>Waiting for the host</h2><p>The next question will appear here.</p></div><div class="card hidden" id="questionBox"><div class="row" style="justify-content:space-between"><div><div id="label" class="gold"></div><div id="number" class="small"></div></div><div id="timer" class="timer">20</div></div><div id="question" class="clue"></div><div id="choices"></div><button class="btn green" id="submit" style="width:100%;margin-top:12px" disabled>Submit Answer</button><div id="answerStatus" class="status">Select one answer.</div><div id="revealed" class="status hidden"></div></div></section>
</main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script>
const firebaseConfig = {
  apiKey: "AIzaSyCwchjG95prUrQUlgQ4mWNQmFQ3G1xBjis",
  authDomain: "flash-jeopardy-live.firebaseapp.com",
  databaseURL: "https://flash-jeopardy-live-default-rtdb.firebaseio.com",
  projectId: "flash-jeopardy-live",
  storageBucket: "flash-jeopardy-live.firebasestorage.app",
  messagingSenderId: "833674093929",
  appId: "1:833674093929:web:9a7487c2c1feec4f2dc9f8"
};
const $=id=>document.getElementById(id);let db,auth,uid,roomRef,player,current=null,selected=null,timerId=null,submittedFor=null;const configured=!firebaseConfig.databaseURL.startsWith('PASTE_');if(configured){firebase.initializeApp(firebaseConfig);db=firebase.database();auth=firebase.auth();$('configWarning').classList.add('hidden')}const urlCode=new URLSearchParams(location.search).get('game');if(urlCode)$('code').value=urlCode.toUpperCase();
$('joinBtn').onclick=async()=>{if(!configured)return alert('The databaseURL still needs to be added.');const name=$('name').value.trim(),code=$('code').value.trim().toUpperCase(),teamId=$('team').value;if(!name)return alert('Enter your name.');$('joinBtn').disabled=true;try{const cred=await auth.signInAnonymously();uid=cred.user.uid;roomRef=db.ref('games/'+code);const snap=await roomRef.once('value');if(!snap.exists()||snap.val().status!=='open')throw Error('The game session is not open. Ask the host to start it.');const team=snap.val().teams[teamId];player={playerName:name,teamId,teamName:team.name,joinedAt:firebase.database.ServerValue.TIMESTAMP};await roomRef.child('players/'+uid).set(player);roomRef.child('players/'+uid).onDisconnect().remove();$('join').classList.add('hidden');$('game').classList.remove('hidden');$('teamName').textContent=team.name;listen()}catch(e){$('joinStatus').textContent=e.message;$('joinStatus').classList.remove('hidden');$('joinBtn').disabled=false}}
function listen(){roomRef.child('teams/'+player.teamId+'/score').on('value',s=>$('score').textContent=s.val()||0);roomRef.child('status').on('value',s=>{if(s.val()==='ended')showWaiting('The game has ended.')});roomRef.child('currentQuestion').on('value',s=>{const q=s.val();if(!q){current=null;showWaiting('Waiting for the host');return};renderQuestion(q)})}
function renderQuestion(q){const isNew=!current||current.id!==q.id;current=q;if(isNew){selected=null;submittedFor=null;$('submit').disabled=true}$('waiting').classList.add('hidden');$('questionBox').classList.remove('hidden');$('label').textContent=`${q.category} • ${q.value} points`;$('number').textContent=`Question ${q.number} of ${q.total}`;$('question').textContent=q.q;$('choices').innerHTML=q.choices.map((x,i)=>`<button class="choice" data-i="${i}">${letter(i)}. ${safe(x)}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>selectChoice(+b.dataset.i));if(selected!==null)markSelected();const locked=!q.acceptingAnswers||submittedFor===q.id;setLocked(locked);if(q.answerVisible){document.querySelectorAll('.choice').forEach((b,i)=>b.classList.toggle('correct',i===q.correct));$('revealed').textContent='Correct response: '+q.response;$('revealed').classList.remove('hidden')}else $('revealed').classList.add('hidden');runTimer(q.endsAt)}
function selectChoice(i){if(!current?.acceptingAnswers||submittedFor===current.id)return;selected=i;markSelected();$('submit').disabled=false;$('answerStatus').textContent='Selected '+letter(i)+'. Tap Submit Answer.'}
function markSelected(){document.querySelectorAll('.choice').forEach((b,i)=>b.classList.toggle('selected',i===selected))}
$('submit').onclick=async()=>{if(selected===null||!current?.acceptingAnswers)return;await roomRef.child('responses/'+current.id+'/'+uid).set({...player,choice:selected,choiceText:current.choices[selected],submittedAt:firebase.database.ServerValue.TIMESTAMP});submittedFor=current.id;setLocked(true);$('answerStatus').textContent='Answer locked: '+letter(selected)+'. '+current.choices[selected]}
function setLocked(locked){document.querySelectorAll('.choice').forEach(b=>b.disabled=locked);$('submit').disabled=locked||selected===null;if(!current?.acceptingAnswers&&submittedFor!==current?.id)$('answerStatus').textContent="Time is up. Answers are closed."}
function runTimer(endsAt){clearInterval(timerId);const update=()=>{const n=Math.max(0,Math.ceil((endsAt-Date.now())/1000));$('timer').textContent=n||'TIME';if(n<=0){clearInterval(timerId);setLocked(true)}};update();timerId=setInterval(update,250)}
function showWaiting(text){clearInterval(timerId);$('waiting').classList.remove('hidden');$('questionBox').classList.add('hidden');$('waiting').querySelector('h2').textContent=text}function letter(i){return String.fromCharCode(65+Number(i))}function safe(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script></body></html>
