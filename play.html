<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLASH Jeopardy Participant</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1f3a;color:#fff;font-family:Segoe UI,Arial,sans-serif}header{padding:16px 22px;background:#081830;border-bottom:4px solid #00a3ad;display:flex;justify-content:space-between;align-items:center}h1{margin:0}h1 span,h2,.gold{color:#ffc72c}main{max-width:1050px;margin:auto;padding:18px}.card{background:#081830;border:2px solid #00a3ad;border-radius:10px;padding:18px;margin-bottom:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:7px;padding:11px 15px;background:#0057b8;color:#fff;font-weight:700;cursor:pointer}.green{background:#2fa84f}.red{background:#df4747}.teal{background:#00a3ad}.hidden{display:none!important}input,select{padding:11px;border-radius:7px;border:1px solid #aac;width:100%}.timer{font-size:58px;color:#ffc72c;font-weight:900}.clue{font-size:clamp(22px,4vw,36px);text-align:center;padding:20px}.choice{width:100%;padding:13px;margin:7px 0;border:2px solid #3c6ea8;border-radius:8px;background:#123a73;color:#fff;text-align:left;font-weight:700;font-size:17px}.choice.selected{border-color:#ffc72c}.choice.correct{background:#174e2b;border-color:#2fa84f}.status{background:#123a73;padding:10px;border-radius:7px;margin-top:10px}.score{font-size:34px;color:#ffc72c;font-weight:900}.team{flex:1;min-width:190px}.special{font-size:clamp(30px,6vw,60px);text-align:center;color:#ffc72c;font-weight:900}.link{color:#fff;text-decoration:underline;word-break:break-all}.progress{height:10px;background:#183657}.progress span{display:block;height:100%;background:#ffc72c}@media(max-width:650px){header{display:block}.timer{font-size:48px}}main{max-width:680px}.teamScore{font-size:52px;text-align:center;color:#ffc72c;font-weight:900}</style></head><body><header><h1>FLASH <span>JEOPARDY</span></h1><div>PARTICIPANT • Confidential, Cotality L&amp;D</div></header><main><div id="warn" class="card"><h2>Setup item</h2><p>The host needs to add the databaseURL.</p></div><section id="join" class="card"><h2>Join Game</h2><label>Game code</label><input id="code" value="OPENLY26"><label>Name</label><input id="name"><label>Team</label><select id="team"><option value="team1">Team 1</option><option value="team2">Team 2</option><option value="team3">Team 3</option></select><button id="joinBtn" class="btn green" style="width:100%;margin-top:12px">Join Game</button><div id="joinStatus" class="status hidden"></div></section><section id="game" class="hidden"><div class="card"><div id="teamName" style="text-align:center"></div><div id="score" class="teamScore">0</div><div style="text-align:center">TEAM POINTS</div></div><div id="waiting" class="card"><h2>Waiting for host</h2></div><div id="qbox" class="card hidden"><div id="special" class="special hidden"></div><div class="row" style="justify-content:space-between"><div><div id="label" class="gold"></div><div id="num"></div></div><div id="timer" class="timer"></div></div><div id="question" class="clue"></div><div id="choices"></div><button id="submit" class="btn green" style="width:100%" disabled>Submit Answer</button><div id="status" class="status">Select one answer.</div><div id="correct" class="status hidden"></div></div></section></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script>const firebaseConfig={apiKey:"AIzaSyCwchjG95prUrQUlgQ4mWNQmFQ3G1xBjis",authDomain:"flash-jeopardy-live.firebaseapp.com",databaseURL:"https://flash-jeopardy-live-default-rtdb.firebaseio.com",projectId:"flash-jeopardy-live",storageBucket:"flash-jeopardy-live.firebasestorage.app",messagingSenderId:"833674093929",appId:"1:833674093929:web:9a7487c2c1feec4f2dc9f8"};const $=x=>document.getElementById(x);let db,auth,uid,ref,player,cur,sel=null,tick,submitted;const ok=!firebaseConfig.databaseURL.startsWith('PASTE_');if(ok){firebase.initializeApp(firebaseConfig);db=firebase.database();auth=firebase.auth();$('warn').classList.add('hidden')}let g=new URLSearchParams(location.search).get('game');if(g)$('code').value=g;$('joinBtn').onclick=async()=>{if(!ok)return alert('Add databaseURL first.');let name=$('name').value.trim(),code=$('code').value.trim().toUpperCase(),teamId=$('team').value;if(!name)return alert('Enter your name.');try{uid=(await auth.signInAnonymously()).user.uid;ref=db.ref('games/'+code);let x=(await ref.once('value')).val();if(!x||x.status!='open')throw Error('Game is not open.');player={playerName:name,teamId,teamName:x.teams[teamId].name};await ref.child('players/'+uid).set(player);$('join').classList.add('hidden');$('game').classList.remove('hidden');$('teamName').textContent=player.teamName;listen()}catch(e){$('joinStatus').textContent=e.message;$('joinStatus').classList.remove('hidden')}};function listen(){ref.child('teams/'+player.teamId+'/score').on('value',s=>$('score').textContent=s.val()||0);ref.child('currentQuestion').on('value',s=>{let q=s.val();if(!q){$('waiting').classList.remove('hidden');$('qbox').classList.add('hidden');return};render(q)})}function render(q){let fresh=!cur||cur.id!=q.id;cur=q;if(fresh){sel=null;submitted=null}$('waiting').classList.add('hidden');$('qbox').classList.remove('hidden');$('special').classList.toggle('hidden',!q.dd&&!q.final);$('special').textContent=q.dd?'DAILY DOUBLE!':q.final?'FINAL JEOPARDY':'';$('label').textContent=q.final?q.cat:`${q.cat} • ${q.dd?q.pts*2:q.pts} points`;$('num').textContent=q.final?'Final Jeopardy':`Question ${q.number} of ${q.total}`;$('question').textContent=q.q;$('choices').innerHTML=q.c.map((x,i)=>`<button class="choice" data-i="${i}">${L(i)}. ${x}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>pick(+b.dataset.i));lock(!q.acceptingAnswers||submitted==q.id);if(q.answerVisible){document.querySelectorAll('.choice')[q.a].classList.add('correct');$('correct').textContent='Correct response: '+q.r;$('correct').classList.remove('hidden')}else $('correct').classList.add('hidden');clock(q.endsAt)}function pick(i){if(!cur.acceptingAnswers||submitted==cur.id)return;sel=i;document.querySelectorAll('.choice').forEach((b,j)=>b.classList.toggle('selected',i==j));$('submit').disabled=false;$('status').textContent='Selected '+L(i)+'. Tap Submit Answer.'}$('submit').onclick=async()=>{if(sel===null)return;await ref.child('responses/'+cur.id+'/'+uid).set({...player,choice:sel,choiceText:cur.c[sel]});submitted=cur.id;lock(true);$('status').textContent='Answer locked.'};function lock(v){document.querySelectorAll('.choice').forEach(b=>b.disabled=v);$('submit').disabled=v||sel===null}function clock(end){clearInterval(tick);let f=()=>{let n=Math.max(0,Math.ceil((end-Date.now())/1000));$('timer').textContent=n||'TIME';if(!n)lock(true)};f();tick=setInterval(f,250)}function L(i){return String.fromCharCode(65+Number(i))}</script></body></html>
